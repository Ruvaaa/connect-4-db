name: Connect 4

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest

    if: startsWith(github.event.issue.title, 'connect4|')

    permissions:
      contents: write
      issues: write

    steps:
      - name: Play Connect 4
        uses: jonathan-gin/readme-connect4@master
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
